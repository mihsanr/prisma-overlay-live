<title>Prisma · Timer</title>
<style>
/* tokens.css — seluruh warna & ritme Prisma.
   Satu-satunya file yang boleh berisi hex. Colorway graphite = overlay milestone apa adanya.
   Colorway mono & violet menyusul di T15. */
:root {
  /* Permukaan pil */
  --cangkang: #161618;  /* tepi luar pil */
  --badan:    #232325;  /* badan pil */
  --tombol:   #323234;  /* lingkaran tempat ikon */
  --lajur:    #2C2C2E;  /* bagian bar yang belum terisi */

  /* Gradasi permukaan (di overlay milestone ditulis langsung sebagai hex) */
  --badan-atas:    #2A2A2C;
  --badan-bawah:   #1D1D1F;
  --tombol-atas:   #3C3C3F;
  --tombol-bawah:  #262628;
  --panel-atas:    #19191B;
  --panel-tengah:  #252527;
  --panel-bawah:   #202022;

  /* Teks & logam */
  --putih:    #FFFFFF;  /* angka utama, tulisan penegasan */
  --abu:      #8E8E93;  /* teks kecil */
  --perak:    #D1D1D6;  /* isi bar */

  /* Spektrum aksen */
  --pijar:    #FFF3DC;  /* titik paling terang (putih hangat) */
  --emas:     #FFB23F;
  --merah:    #FF4A3D;
  --magenta:  #E23DF5;
  --biru:     #2F66FF;
  --sian:     #3FD2FF;
  --hijau:    #A6FF6E;

  /* Warna gelap di sela spektrum. Jangan dibuang: inilah yang membuat
     cincin terbaca sebagai logam iridescent, bukan pelangi datar. */
  --kelam-1:  #120F2A;
  --kelam-2:  #0D0D1C;
  --kelam-3:  #141A52;
  --kelam-4:  #1A2A9A;
  --kelam-5:  #10123A;

  /* Logam ikon (kado, bintang): sisi terang & sisi gelap */
  --logam-terang-1: #FFFFFF;
  --logam-terang-2: #E6E6EA;
  --logam-terang-3: #C4C4CA;
  --logam-gelap-1:  #E9E9ED;
  --logam-gelap-2:  #C9C9CF;
  --logam-gelap-3:  #A2A2A8;

  /* Cahaya hangat dari dalam kado yang terbuka */
  --cahaya-1: #FFF6E4;
  --cahaya-2: #FFC78A;
  --cahaya-3: #FF9A4D;

  /* Pangkal isi bar (ujungnya --perak lalu --putih) */
  --isi-pangkal: #6E6E73;

  /* Lama satu putaran cincin saat diam. Makin besar makin pelan. */
  --putaran: 8s;
}

</style>

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}
body {
  font-family: "Inter", "SF Pro Display", system-ui, "Segoe UI", sans-serif;
  color: var(--putih);
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { display: none; }

/* Stage berukuran tetap (lebar & tinggi diatur per layout), lalu diskalakan.
   Tersembunyi sampai siap supaya keadaan setengah jadi tidak pernah tampil. */
#stage {
  --heat: 0; /* 0..1, diatur JS: seberapa "panas" cahaya saat ini */
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  transform: scale(var(--scale, 1));
  visibility: hidden;
}
#stage.ready { visibility: visible; }

</style>
<style>
/* surface.css — permukaan graphite: pil, panel, tombol bulat.
   Hanya rupa. Posisi & ukuran ditentukan widget. */

/* ---- Pil: cangkang luar + badan dalam inset 5px ---- */
/* Radius 9999px dijepit browser menjadi tepat setengah tinggi,
   jadi ujungnya bulat penuh berapa pun tinggi pilnya. */
.pill {
  position: absolute;
  border-radius: 9999px;
  background: var(--cangkang);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.05),
    0 12px 32px rgba(0, 0, 0, 0.5);
  overflow: hidden;
}
.pill::before {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: inherit;
  background: linear-gradient(180deg, var(--badan-atas) 0%, var(--badan) 38%, var(--badan-bawah) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.07),
    inset 0 0 0 1px rgba(255, 255, 255, 0.035),
    0 0 0 1px rgba(0, 0, 0, 0.35);
}
/* Pantulan cahaya cincin di permukaan pil */
.spill {
  position: absolute;
  background: radial-gradient(closest-side, rgba(255, 214, 170, 0.11), rgba(255, 214, 170, 0.035) 55%, transparent);
  opacity: calc(0.75 + var(--heat) * 0.6);
}

/* ---- Panel: laci di bawah pil, tempat teks berjalan ---- */
.panel {
  position: absolute;
  border-radius: 0 0 14px 14px;
  background: linear-gradient(180deg, var(--panel-atas) 0%, var(--panel-tengah) 30%, var(--panel-bawah) 100%);
}

/* ---- Tombol bundar tempat ikon ---- */
.btn {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(120% 90% at 50% 18%, var(--tombol-atas) 0%, var(--tombol) 52%, var(--tombol-bawah) 100%);
  box-shadow:
    0 0 0 3px rgba(12, 12, 14, 0.9),
    inset 0 0 0 1px rgba(255, 255, 255, 0.07),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 -10px 18px rgba(0, 0, 0, 0.35);
}
/* Kilat di dalam tombol saat kejadian besar */
.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 42%, rgba(255, 240, 215, 0.4), rgba(255, 200, 140, 0.12) 45%, transparent 70%);
  opacity: 0;
}

</style>
<style>
/* spectrum.css — aksen pelangi: cincin, halo, shimmer, rim mengalir, komet, flare, shock.
   Cincin disusun untuk .orb 112×112 (widget cukup mengatur left/top).
   Putaran, aliran rim, dan --heat digerakkan JS, bukan animasi CSS. */

/* ---- Cincin pelangi (bintang utama) ---- */
.orb {
  position: absolute;
  width: 112px;
  height: 112px;
  isolation: isolate;
}
.spin, .shock, .shimmer, .spectrum, .halo {
  position: absolute;
  inset: 0;
  border-radius: 50%;
}
.spin, .shimmer { will-change: transform; }
.orb > .btn { left: 9px; top: 9px; width: 94px; height: 94px; }

/* Urutan warna searah jarum jam, mulai dari atas. Dua titik putih = pantulan cahaya. */
.spectrum {
  background: conic-gradient(
    var(--pijar) 0deg,
    var(--emas) 14deg,
    var(--merah) 26deg,
    var(--hijau) 35deg,
    var(--biru) 47deg,
    var(--kelam-1) 62deg,
    var(--merah) 77deg,
    var(--kelam-2) 93deg,
    var(--sian) 108deg,
    var(--biru) 124deg,
    var(--kelam-3) 146deg,
    var(--biru) 170deg,
    var(--sian) 190deg,
    var(--pijar) 208deg,
    var(--emas) 220deg,
    var(--merah) 232deg,
    var(--magenta) 244deg,
    var(--biru) 258deg,
    var(--kelam-4) 276deg,
    var(--kelam-5) 292deg,
    var(--biru) 308deg,
    var(--sian) 324deg,
    var(--hijau) 336deg,
    var(--emas) 348deg,
    var(--pijar) 360deg
  );
}
/* Cincin tajam setebal 6px (mask hanya membaca alfa, warnanya tidak berpengaruh) */
.band {
  -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 6.5px), black calc(100% - 5.5px), black calc(100% - 1px), transparent 100%);
          mask: radial-gradient(closest-side, transparent calc(100% - 6.5px), black calc(100% - 5.5px), black calc(100% - 1px), transparent 100%);
}
.band-thick {
  -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 13px), black calc(100% - 10px), black calc(100% - 2px), transparent 100%);
          mask: radial-gradient(closest-side, transparent calc(100% - 13px), black calc(100% - 10px), black calc(100% - 2px), transparent 100%);
}
.spin > .spectrum.band { filter: brightness(calc(1 + var(--heat) * 0.35)); }

/* Pendar di sekitar cincin */
.halo-near { filter: blur(3px); opacity: calc(0.7 + var(--heat) * 0.3); }
.halo-wide { inset: -5px; filter: blur(12px); opacity: calc(0.4 + var(--heat) * 0.6); }

/* Bunga cahaya hangat di titik paling terang, ikut berputar */
.hot {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 246, 228, 0.95) 0%, rgba(255, 196, 120, 0.55) 16%, rgba(255, 140, 60, 0.2) 38%, rgba(255, 120, 40, 0) 66%);
  opacity: calc(0.85 + var(--heat) * 0.15);
  transform: scale(calc(1 + var(--heat) * 0.6));
}
.hot-a { left: 14px; top: -39.5px; width: 84px; height: 84px; }    /* pusat di sudut 0° */
.hot-b { left: -1.1px; top: 71.2px; width: 64px; height: 64px; opacity: calc(0.6 + var(--heat) * 0.4); } /* pusat di sudut 208° */

/* Guratan pelangi halus yang berputar berlawanan arah */
.shimmer {
  background: repeating-conic-gradient(
    rgba(255, 90, 60, 0) 0deg,
    rgba(255, 90, 60, 0.55) 5deg,
    rgba(140, 255, 140, 0.5) 9deg,
    rgba(60, 120, 255, 0.55) 13deg,
    rgba(60, 120, 255, 0) 18deg,
    rgba(0, 0, 0, 0) 40deg
  );
  mix-blend-mode: screen;
  opacity: 0.5;
}

/* ---- Ledakan cahaya & gelombang pelangi (kejadian besar) ---- */
.flare {
  position: absolute;
  inset: -94px; /* 300×300, pusatnya sama dengan pusat cincin */
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 248, 235, 0.9) 0%, rgba(255, 205, 140, 0.5) 14%, rgba(255, 140, 70, 0.18) 34%, rgba(255, 120, 60, 0) 60%);
  opacity: 0;
}
.shock { opacity: 0; }

#stage.celebrate .flare      { animation: flare 1.6s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
#stage.celebrate .shock      { animation: shock 1.2s cubic-bezier(0.15, 0.6, 0.3, 1) 0.05s both; }
#stage.celebrate .btn::after { animation: btn-flash 1.4s ease-out both; }

@keyframes flare {
  0%   { opacity: 0; transform: scale(0.35); }
  14%  { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.25); }
}
@keyframes shock {
  0%   { opacity: 0; transform: scale(1); }
  10%  { opacity: 0.95; }
  100% { opacity: 0; transform: scale(1.75); }
}
@keyframes btn-flash {
  0%   { opacity: 0; }
  15%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ---- Rim mengalir & komet di tepi panel (SVG) ---- */
.panel-rim {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}
.panel-rim path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
/* Garis pelangi yang warnanya mengalir seperti cincin, dengan pendar tipis */
.pr-near  { stroke: url(#spektrum-alir); stroke-width: 3; opacity: calc(0.3 + var(--heat) * 0.3); }
.pr-line  { stroke: url(#spektrum-alir); stroke-width: 2.5; }
/* Dua komet putih kecil yang menyusuri tepi panel */
.pr-glare { stroke: var(--pijar); stroke-width: 4; stroke-dasharray: 40 394; opacity: calc(0.3 + var(--heat) * 0.3); }

<script id="prisma-config" type="application/json">{}</script>
<script>
/* config.js — config widget dari tiga lapis; yang belakangan menimpa yang depan:
     1. bawaan — ditulis di dalam widget
     2. baked  — JSON di dalam blok <script id="prisma-config" type="application/json">, ditulis
                 konfigurator saat file diunduh. Ini jalur utama: OBS "Local File" membuang query string.
     3. query  — ?text=HALO&speed=70

   Pemakaian:
     const cfg = Prisma.config.baca(
       { text: "SELAMAT DATANG DI STREAM", speed: 70, separator: "dot" }, // bawaan
       { separator: ["dot", "diamond", "none"] }                          // pilihan sah (opsional)
     );

   Tipe tiap kunci mengikuti tipe nilai bawaannya (number, boolean, string, array).
   Kunci yang tidak ada di bawaan, nilai yang tidak bisa dikonversi, atau nilai di luar pilihan
   diabaikan diam-diam: lapis sebelumnya tetap berlaku. Fungsi ini tidak pernah melempar error.
   Kunci `layout` ("auto" | "wide" | "tall") selalu tersedia untuk semua widget. */
(() => {
  "use strict";

  const Prisma = (window.Prisma = window.Prisma || {});

  const BAWAAN_UMUM = { layout: "auto" };
  const PILIHAN_UMUM = { layout: ["auto", "wide", "tall"] };
  const TEKS_BENAR = ["true", "1", "ya", "yes", "on"];
  const TEKS_SALAH = ["false", "0", "tidak", "no", "off"];
  const ABAIKAN = {}; // penanda: nilai tidak sah, lapis sebelumnya tetap berlaku

  const jenis = (v) => (Array.isArray(v) ? "array" : v === null ? "null" : typeof v);

  // "70" → 70, "12.5" → 12.5, "1.500.000" → 1500000 (titik ribuan gaya Indonesia), "0,5" → 0.5.
  // Catatan: "1.500" dibaca 1500, karena penulisan ribuan lebih lazim bagi pembeli daripada desimal bertitik.
  function keAngka(v) {
    if (typeof v === "number") return Number.isFinite(v) ? v : ABAIKAN;
    if (typeof v !== "string") return ABAIKAN;
    let t = v.replace(/\s+/g, "");
    if (/^[-+]?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
    else if (/^[-+]?\d+,\d+$/.test(t)) t = t.replace(",", ".");
    if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return ABAIKAN;
    const n = Number(t);
    return Number.isFinite(n) ? n : ABAIKAN;
  }

  // Di query, kunci tanpa nilai (?comet) berarti true.
  function keBoolean(v, dariQuery) {
    if (typeof v === "boolean") return v;
    if (v === 1 || v === 0) return v === 1;
    if (typeof v !== "string") return ABAIKAN;
    const t = v.trim().toLowerCase();
    if (t === "" && dariQuery) return true;
    if (TEKS_BENAR.includes(t)) return true;
    if (TEKS_SALAH.includes(t)) return false;
    return ABAIKAN;
  }

  function keTeks(v) {
    if (typeof v === "string") return v;
    if ((typeof v === "number" && Number.isFinite(v)) || typeof v === "boolean") return String(v);
    return ABAIKAN;
  }

  // Array asli (baked), JSON array ('[{"icon":"ig"}]'), atau daftar dipisah koma ("ig, yt").
  function keArray(v) {
    if (Array.isArray(v)) return v.slice();
    if (typeof v !== "string") return ABAIKAN;
    const t = v.trim();
    if (t.charAt(0) === "[") {
      try {
        const hasil = JSON.parse(t);
        return Array.isArray(hasil) ? hasil : ABAIKAN;
      } catch (_) {
        return ABAIKAN;
      }
    }
    return t.split(",").map((s) => s.trim()).filter(Boolean);
  }

  function konversi(nilai, bawaan, daftarPilihan, dariQuery) {
    if (nilai === null || nilai === undefined) return ABAIKAN;
    let hasil;
    switch (jenis(bawaan)) {
      case "number": hasil = keAngka(nilai); break;
      case "boolean": hasil = keBoolean(nilai, dariQuery); break;
      case "string": hasil = keTeks(nilai); break;
      case "array": hasil = keArray(nilai); break;
      default: hasil = jenis(nilai) === jenis(bawaan) ? nilai : ABAIKAN;
    }
    if (hasil === ABAIKAN || !Array.isArray(daftarPilihan) || daftarPilihan.includes(hasil)) return hasil;
    // Pilihan teks tidak peka huruf besar/kecil: "TALL" → "tall".
    if (typeof hasil !== "string") return ABAIKAN;
    const kecil = hasil.trim().toLowerCase();
    const cocok = daftarPilihan.find((p) => typeof p === "string" && p.toLowerCase() === kecil);
    return cocok === undefined ? ABAIKAN : cocok;
  }

  function terapkanLapis(hasil, bawaan, pilihan, entri, dariQuery) {
    if (!entri) return;
    // Nama kunci tidak peka huruf besar/kecil (?endtext= → endText), tapi yang persis sama didahulukan.
    const kunciKecil = new Map(Object.keys(bawaan).map((k) => [k.toLowerCase(), k]));
    for (const [masuk, nilai] of entri) {
      const kunci = Object.prototype.hasOwnProperty.call(bawaan, masuk)
        ? masuk
        : kunciKecil.get(String(masuk).toLowerCase());
      if (kunci === undefined) continue;
      const v = konversi(nilai, bawaan[kunci], pilihan[kunci], dariQuery);
      if (v !== ABAIKAN) hasil[kunci] = v;
    }
  }

  function entriBaked(masukan) {
    if (masukan === null || masukan === undefined) return null;
    let objek = masukan;
    if (typeof masukan === "string") {
      if (!masukan.trim()) return null;
      try {
        objek = JSON.parse(masukan);
      } catch (_) {
        console.warn("[prisma] config: isi #prisma-config bukan JSON yang sah, diabaikan");
        return null;
      }
    }
    return jenis(objek) === "object" ? Object.entries(objek) : null;
  }

  function entriQuery(masukan) {
    if (masukan === null || masukan === undefined) return null;
    return Array.from(new URLSearchParams(masukan).entries());
  }

  function bakedDariHalaman() {
    if (typeof document === "undefined") return null;
    const el = document.getElementById("prisma-config");
    return el ? el.textContent : null;
  }

  function queryDariHalaman() {
    return typeof location === "undefined" ? "" : location.search;
  }

  // sumber (opsional, untuk uji): { baked: string | objek | null, query: string }.
  // Tanpa sumber, baked dibaca dari #prisma-config dan query dari location.search.
  function baca(bawaanWidget, pilihanWidget, sumber) {
    const bawaan = Object.assign({}, BAWAAN_UMUM, jenis(bawaanWidget) === "object" ? bawaanWidget : null);
    const pilihan = Object.assign({}, PILIHAN_UMUM, jenis(pilihanWidget) === "object" ? pilihanWidget : null);
    const hasil = {};
    for (const k of Object.keys(bawaan)) hasil[k] = Array.isArray(bawaan[k]) ? bawaan[k].slice() : bawaan[k];

    const s = jenis(sumber) === "object" ? sumber : {};
    const lapis = [
      [() => entriBaked("baked" in s ? s.baked : bakedDariHalaman()), false],
      [() => entriQuery("query" in s ? s.query : queryDariHalaman()), true],
    ];
    // Tiap lapis dibaca terpisah: satu lapis rusak tidak menggugurkan lapis lain.
    for (const [ambil, dariQuery] of lapis) {
      try {
        terapkanLapis(hasil, bawaan, pilihan, ambil(), dariQuery);
      } catch (err) {
        console.warn("[prisma] config:", err);
      }
    }
    return hasil;
  }

  Prisma.config = { baca };
})();

</script>
<script>
/* format.js — format angka & waktu gaya Indonesia.
   Sengaja tanpa Intl: hasilnya sama persis di Node, Chrome, dan CEF bawaan OBS. */
(() => {
  "use strict";

  const Prisma = (window.Prisma = window.Prisma || {});

  // 1500000 → "1.500.000" (gaya "id", bawaan) atau "1500000" (gaya "plain"). Dibulatkan ke bilangan bulat.
  function angka(n, gaya) {
    let x = Math.round(Number(n));
    if (!Number.isFinite(x)) x = 0;
    const tanda = x < 0 ? "-" : "";
    const digit = Math.abs(x).toFixed(0);
    if (gaya === "plain") return tanda + digit;
    return tanda + digit.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  // 1500000 → "Rp1.500.000", -2500 → "-Rp2.500".
  function rupiah(n) {
    const t = angka(n, "id");
    return t.charAt(0) === "-" ? "-Rp" + t.slice(1) : "Rp" + t;
  }

  // Detik → "mm:ss", atau "hh:mm:ss" kalau opsi.jam. Tanpa jam, menit terus bertambah ("75:00").
  // opsi.pembulatan: "bawah" (bawaan, untuk hitung naik) atau "atas" (hitung mundur: sisa 0,2 detik
  // tetap tampil "00:01", dan "00:00" baru muncul saat waktunya benar-benar habis).
  function waktu(detik, opsi) {
    const o = opsi || {};
    let s = Number(detik);
    if (!Number.isFinite(s) || s < 0) s = 0;
    // Toleransi kecil: 2.9999999 dari selisih timestamp tetap dibaca 3.
    s = o.pembulatan === "atas" ? Math.ceil(s - 1e-6) : Math.floor(s + 1e-6);
    const dua = (x) => (x < 10 ? "0" : "") + x;
    const menit = Math.floor(s / 60);
    if (o.jam) return dua(Math.floor(s / 3600)) + ":" + dua(menit % 60) + ":" + dua(s % 60);
    return dua(menit) + ":" + dua(s % 60);
  }

  Prisma.format = { angka, rupiah, waktu };
})();

</script>
<script>
/* loop.js — satu requestAnimationFrame bersama untuk semua gerakan kontinu.
   Widget mendaftar lewat Prisma.loop.sub(fn); fn(dt, now) dipanggil tiap bingkai, dt dalam detik.
   Loop hanya berjalan kalau ada pelanggan dan halaman tidak tersembunyi (document.hidden).

   Prisma.loop.batasFps(30) membatasi seberapa sering pelanggan dipanggil (dipakai layar penuh yang tenang).
   Pada bingkai yang dilewati tidak ada yang berubah, jadi browser tidak perlu mengomposisi ulang layar. */
(() => {
  "use strict";

  const Prisma = (window.Prisma = window.Prisma || {});
  const DT_MAKS = 0.1; // bingkai yang tersendat tidak boleh membuat gerakan melompat jauh

  const pelanggan = new Set();
  const sudahDilaporkan = new WeakSet();
  let bingkai = 0;     // id requestAnimationFrame yang sedang dijadwalkan, 0 = tidak ada
  let lalu = 0;        // timestamp bingkai sebelumnya, 0 = bingkai pertama setelah (lanjut) jalan
  let selangMin = 0;   // detik minimum antar panggilan pelanggan; 0 = setiap bingkai
  let terkumpul = 0;   // waktu sejak panggilan pelanggan terakhir
  let pertama = true;  // panggilan pertama setelah (lanjut) jalan selalu dilakukan, dengan dt 0

  function detak(now) {
    bingkai = 0;
    terkumpul += lalu ? Math.max(0, (now - lalu) / 1000) : 0;
    lalu = now;
    if (!pertama && selangMin && terkumpul < selangMin - 0.002) {
      jadwalkan(); // lewati bingkai ini: belum waktunya
      return;
    }
    const dt = pertama ? 0 : Math.min(DT_MAKS, terkumpul);
    pertama = false;
    terkumpul = 0;
    // Salinan: pelanggan boleh sub/unsub di tengah bingkai tanpa mengacaukan urutan.
    for (const fn of Array.from(pelanggan)) {
      if (!pelanggan.has(fn)) continue;
      try {
        fn(dt, now);
      } catch (err) {
        // Satu widget error tidak boleh menghentikan yang lain. Laporkan sekali saja, jangan 60×/detik.
        if (!sudahDilaporkan.has(fn)) {
          sudahDilaporkan.add(fn);
          console.error("[prisma] loop:", err);
        }
      }
    }
    jadwalkan();
  }

  function jadwalkan() {
    if (!bingkai && pelanggan.size && !document.hidden) bingkai = requestAnimationFrame(detak);
  }

  function berhenti() {
    if (bingkai) cancelAnimationFrame(bingkai);
    bingkai = 0;
    lalu = 0; // saat lanjut, dt panggilan pertama = 0 (bukan lama waktu tersembunyi)
    terkumpul = 0;
    pertama = true;
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) berhenti();
    else jadwalkan();
  });

  Prisma.loop = {
    sub(fn) {
      if (typeof fn !== "function") return fn;
      pelanggan.add(fn);
      jadwalkan();
      return fn;
    },
    unsub(fn) {
      pelanggan.delete(fn);
      if (!pelanggan.size) berhenti();
    },
    // fps <= 0 atau bukan angka = tanpa batas (setiap bingkai).
    batasFps(fps) {
      const f = Number(fps);
      selangMin = f > 0 ? 1 / f : 0;
    },
  };
})();

</script>
<script>
/* stage.js — sistem skala & pemilihan layout.
   Semua elemen widget ditata absolut di dalam #stage berukuran tetap, lalu stage diskalakan:
   scale = min(innerWidth / W, innerHeight / H), transform-origin 0 0 (lihat reset.css).

   Layout "auto" memilih layout yang proporsinya paling mirip viewport. Batasnya rata-rata geometris
   rasio kedua layout: untuk widget layar penuh (1920×1080 & 1080×1920) batas itu tepat 1, jadi
   rasio >= 1 → wide dan < 1 → tall; untuk widget strip yang ukuran tall-nya pun melebar
   (mis. ticker 1200×180 & 1080×260) batasnya ikut bergeser. Bisa dipaksa "wide" / "tall".

   Pemakaian (setelah DOM awal widget tersusun):
     Prisma.stage.pasang({
       layouts: { wide: { w: 800, h: 280 }, tall: { w: 560, h: 760 } },
       layout: "auto",
       saatGanti(nama, ukuran) {},    // layout berganti (termasuk pertama kali); tata ulang isi di sini
       sebelumTampil(nama, ukuran) {} // font sudah siap, tepat sebelum stage ditampilkan (mis. ukur teks)
     }).then(() => { ... stage sudah tampil ... });

   Stage tetap visibility:hidden sampai layout terpasang DAN font Inter termuat,
   jadi keadaan setengah jadi tidak pernah tergambar. */
(() => {
  "use strict";

  const Prisma = (window.Prisma = window.Prisma || {});
  const NAMA_LAYOUT = ["wide", "tall"];
  const FONT_WAJIB = ["500 16px Inter", "600 16px Inter"];
  const BATAS_FONT_MS = 3000; // kalau font gagal dimuat, stage tetap tampil dengan fallback

  const keadaan = { layout: null, skala: 0, fontSiap: false };
  let opsi = null;
  let stageEl = null;
  let janjiSiap = null;
  let tandaiSiap = () => {};

  // Error di callback widget tidak boleh membuat stage tidak pernah tampil.
  function panggil(fn, ...arg) {
    if (typeof fn !== "function") return;
    try {
      fn(...arg);
    } catch (err) {
      console.error("[prisma] stage:", err);
    }
  }

  function rapikanLayouts(layouts) {
    const hasil = {};
    for (const nama of NAMA_LAYOUT) {
      const l = layouts && layouts[nama];
      const w = Number(l && l.w);
      const h = Number(l && l.h);
      if (w > 0 && h > 0) hasil[nama] = { w, h };
    }
    if (!hasil.wide && !hasil.tall) {
      console.error("[prisma] stage: layouts tidak valid, memakai ukuran stage dari CSS");
      hasil.wide = { w: stageEl.offsetWidth || 800, h: stageEl.offsetHeight || 280 };
    }
    return hasil;
  }

  function pilihLayout(iw, ih) {
    const tersedia = opsi.layouts;
    const paksa = String(opsi.layout == null ? "auto" : opsi.layout).trim().toLowerCase();
    if (NAMA_LAYOUT.includes(paksa) && tersedia[paksa]) return paksa; // nilai lain diabaikan → auto
    if (!tersedia.wide || !tersedia.tall) return tersedia.wide ? "wide" : "tall";
    const batas = Math.sqrt((tersedia.wide.w / tersedia.wide.h) * (tersedia.tall.w / tersedia.tall.h));
    return iw / ih >= batas - 1e-9 ? "wide" : "tall"; // toleransi: 16/9 × 9/16 bisa 0,9999999999999999
  }

  // Dipanggil sinkron di event resize, jadi selesai sebelum browser sempat menggambar.
  function terapkan() {
    const iw = window.innerWidth;
    const ih = window.innerHeight;
    if (!(iw > 0 && ih > 0)) return; // viewport belum punya ukuran (Browser Source bisa mulai dari 0×0)

    const nama = pilihLayout(iw, ih);
    const ukuran = opsi.layouts[nama];
    const ganti = nama !== keadaan.layout;
    if (ganti) {
      keadaan.layout = nama;
      stageEl.style.width = ukuran.w + "px";
      stageEl.style.height = ukuran.h + "px";
      stageEl.setAttribute("data-layout", nama);
    }

    const skala = Math.min(iw / ukuran.w, ih / ukuran.h);
    if (skala !== keadaan.skala) {
      keadaan.skala = skala;
      stageEl.style.setProperty("--scale", String(skala));
    }

    if (ganti) panggil(opsi.saatGanti, nama, ukuran);
    cobaTampil();
  }

  function cobaTampil() {
    if (!keadaan.fontSiap || !keadaan.layout || stageEl.classList.contains("ready")) return;
    panggil(opsi.sebelumTampil, keadaan.layout, opsi.layouts[keadaan.layout]);
    stageEl.classList.add("ready");
    tandaiSiap();
  }

  // Muat font secara eksplisit: document.fonts.ready saja bisa selesai sebelum
  // browser sempat meminta font (font baru diminta saat teks pertama kali ditata).
  function tungguFont() {
    const fonts = document.fonts;
    if (!fonts || typeof fonts.load !== "function") return Promise.resolve();
    const muat = Promise.all(FONT_WAJIB.map((f) => fonts.load(f))).then(() => fonts.ready);
    const batas = new Promise((selesai) => setTimeout(selesai, BATAS_FONT_MS));
    return Promise.race([muat, batas]).catch(() => {});
  }

  function pasang(masukan) {
    if (janjiSiap) return janjiSiap; // cukup sekali per halaman
    stageEl = document.getElementById("stage");
    if (!stageEl) {
      console.error("[prisma] stage: elemen #stage tidak ditemukan");
      return (janjiSiap = Promise.resolve());
    }
    opsi = Object.assign({}, masukan);
    opsi.layouts = rapikanLayouts(opsi.layouts);
    janjiSiap = new Promise((selesai) => { tandaiSiap = selesai; });

    terapkan();
    window.addEventListener("resize", terapkan);
    tungguFont().then(() => {
      keadaan.fontSiap = true;
      cobaTampil();
    });
    return janjiSiap;
  }

  Prisma.stage = {
    pasang,
    layout: () => keadaan.layout,
    skala: () => keadaan.skala,
  };
})();

</script>
<script>
/* orb.js — putaran cincin spektrum & ignite, diangkat dari overlay milestone.
   Cincin berputar pelan terus-menerus (satu putaran = --putaran). ignite(boost, heat) menaikkan
   kecepatan (derajat/detik) dan kecerahan (--heat 0..1) yang lalu meluruh eksponensial sendiri.

   Pemakaian:
     const cincin = Prisma.orb.pasang({ spin: elSpin, shimmer: elShimmer });
     cincin.ignite(520, 0.45); */
(() => {
  "use strict";

  const Prisma = (window.Prisma = window.Prisma || {});
  const TAU_BOOST = 0.9; // detik
  const TAU_HEAT = 1.1;  // detik

  function pasang({ spin, shimmer, panas, sudutAwal = -10 } = {}) {
    const elPanas = panas || document.getElementById("stage");
    const putaran = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--putaran")) || 8;
    const DPS = 360 / putaran;
    const k = { sudut: sudutAwal, boost: 0, heat: 0, heatTampil: -1 };

    function gambar() {
      if (spin) spin.style.transform = "rotate(" + k.sudut.toFixed(2) + "deg)";
      if (shimmer) shimmer.style.transform = "rotate(" + (k.sudut * -0.5).toFixed(2) + "deg)";
      const heat = k.heat < 0.002 ? 0 : Math.round(k.heat * 1000) / 1000;
      if (heat !== k.heatTampil && elPanas) {
        elPanas.style.setProperty("--heat", String(heat));
        k.heatTampil = heat;
      }
    }

    function detak(dt) {
      k.boost *= Math.exp(-dt / TAU_BOOST);
      k.heat *= Math.exp(-dt / TAU_HEAT);
      k.sudut = (k.sudut + (DPS + k.boost) * dt) % 3600;
      gambar();
    }

    gambar();
    Prisma.loop.sub(detak);

    return {
      // boost: tambahan derajat/detik; heat: 0..1 terang cahaya. Keduanya meluruh sendiri.
      ignite(boost, heat) {
        k.boost = Math.max(k.boost, Number(boost) || 0);
        k.heat = Math.min(1, Math.max(k.heat, Number(heat) || 0));
      },
      keadaan: () => ({ sudut: k.sudut, boost: k.boost, heat: k.heat }),
      lepas: () => Prisma.loop.unsub(detak),
    };
  }

  Prisma.orb = { pasang };
})();

</script>
<script>
(() => {
  "use strict";

  const { config, format, loop, stage: panggung, orb } = window.Prisma;

  // 1,5× ukuran Browser Source yang disarankan (wide 520×220, tall 420×300).
  const LAYOUTS = { wide: { w: 780, h: 330 }, tall: { w: 630, h: 450 } };
  const LABEL_BAWAAN = "MULAI DALAM";
  const DURASI_RAYAKAN = 1600; // ms: shock ring + kilat tombol
  const SKALA_MIN = 0.5;       // teks tidak mengecil lebih dari ini; sisanya elipsis

  const cfg = config.baca(
    { mode: "countdown", duration: 300, focus: 1500, break: 300, label: LABEL_BAWAAN, endText: "MULAI!", showHours: false },
    { mode: ["uptime", "countdown", "pomodoro"] }
  );
  const rapikan = (teks) => teks.replace(/\s+/g, " ").trim();
  const detik = (v, cadangan, bolehNol) => (v > 0 || (bolehNol && v === 0) ? v : cadangan);
  const durasiMs = detik(cfg.duration, 300) * 1000;
  const fokusMs = detik(cfg.focus, 1500) * 1000;
  const istirahatMs = detik(cfg.break, 300, true) * 1000;
  // Label bawaan "MULAI DALAM" hanya cocok untuk countdown; di uptime diganti "SUDAH LIVE".
  const label = cfg.mode === "uptime" && cfg.label === LABEL_BAWAAN ? "SUDAH LIVE" : rapikan(cfg.label);
  const teksAkhir = rapikan(cfg.endText) || format.waktu(0, { jam: cfg.showHours });

  const $ = (id) => document.getElementById(id);
  const stageEl = $("stage");
  const waktuEl = $("waktu");
  const labelEl = $("label");
  const cincin = orb.pasang({ spin: $("spin"), shimmer: $("shimmer") });

  // Jam: waktu berjalan = terkumpul (sebelum jeda terakhir) + selisih sejak mulai. Tidak pernah dari dt.
  const jam = { terkumpul: 0, mulai: performance.now(), jalan: true };
  const berlalu = (now) => Math.max(0, jam.terkumpul + (jam.jalan ? now - jam.mulai : 0));
  const tulis = (ms, pembulatan) => format.waktu(ms / 1000, { jam: cfg.showHours, pembulatan });

  function hitung(now) {
    const t = berlalu(now);
    if (cfg.mode === "uptime") return { teks: tulis(t, "bawah"), label, selesai: false };
    if (cfg.mode === "countdown") {
      const sisa = durasiMs - t;
      // Dibulatkan ke atas: "00:01" tetap tampil sampai sisa benar-benar 0, lalu langsung endText.
      return sisa > 0 ? { teks: tulis(sisa, "atas"), label, selesai: false } : { teks: teksAkhir, label, selesai: true };
    }
    const siklus = fokusMs + istirahatMs;
    const ke = Math.floor(t / siklus);
    const dalam = t - ke * siklus;
    const fokus = dalam < fokusMs;
    return {
      teks: tulis(fokus ? fokusMs - dalam : siklus - dalam, "atas"),
      label: (fokus ? "FOKUS" : "ISTIRAHAT") + " · SESI " + (ke + 1),
      fase: (fokus ? "fokus-" : "istirahat-") + ke,
      selesai: false,
    };
  }

  // Teks yang lebih lebar dari kotaknya (menit >= 100, endText panjang) mengecil agar muat;
  // kalau harus lebih kecil dari SKALA_MIN, berhenti di situ dan sisanya dipotong elipsis.
  function pas() {
    waktuEl.classList.remove("terpotong");
    waktuEl.style.setProperty("--kecil", "1");
    if (waktuEl.scrollWidth <= waktuEl.clientWidth) return;
    const skala = (waktuEl.clientWidth - 1) / waktuEl.scrollWidth;
    waktuEl.style.setProperty("--kecil", String(Math.max(SKALA_MIN, skala)));
    waktuEl.classList.toggle("terpotong", skala < SKALA_MIN);
  }

  let timerRayakan = 0;
  function rayakan() {
    stageEl.classList.remove("celebrate");
    void stageEl.offsetWidth; // mulai ulang animasi
    stageEl.classList.add("celebrate");
    cincin.ignite(900, 0.8);
    clearTimeout(timerRayakan);
    timerRayakan = setTimeout(() => stageEl.classList.remove("celebrate"), DURASI_RAYAKAN);
  }

  const tampil = { teks: null, label: null, selesai: false, fase: null };
  function gambar(now) {
    const k = hitung(now);
    let ukurUlang = false;
    if (k.teks !== tampil.teks) {
      ukurUlang = tampil.teks === null || k.teks.length !== tampil.teks.length;
      waktuEl.textContent = k.teks;
      tampil.teks = k.teks;
    }
    if (k.label !== tampil.label) {
      labelEl.textContent = k.label;
      stageEl.classList.toggle("tanpa-label", !k.label);
      tampil.label = k.label;
    }
    if (k.selesai !== tampil.selesai) {
      tampil.selesai = k.selesai;
      stageEl.classList.toggle("selesai", k.selesai);
      ukurUlang = true;
      if (k.selesai) rayakan();
    }
    if (k.fase && k.fase !== tampil.fase) {
      if (tampil.fase) cincin.ignite(520, 0.45); // pergantian fokus ↔ istirahat
      tampil.fase = k.fase;
    }
    if (ukurUlang) pas();
  }

  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
    const now = performance.now();
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      if (jam.jalan) {
        jam.terkumpul += now - jam.mulai;
        jam.jalan = false;
      } else {
        jam.mulai = now;
        jam.jalan = true;
      }
      stageEl.classList.toggle("jeda", !jam.jalan);
      gambar(now);
    } else if (e.key === "r" || e.key === "R") {
      // Kembali ke awal; status jeda dipertahankan.
      jam.terkumpul = 0;
      jam.mulai = now;
      clearTimeout(timerRayakan);
      stageEl.classList.remove("celebrate");
      gambar(now);
    }
  });

  stageEl.classList.add("mode-" + cfg.mode);
  gambar(performance.now());
  loop.sub((dt, now) => gambar(now));

  panggung.pasang({ layouts: LAYOUTS, layout: cfg.layout, saatGanti: pas, sebelumTampil: pas }).then(() => {
    if (document.fonts) document.fonts.addEventListener("loadingdone", pas);
  });
})();
</script>
